name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "yt-dlp[default]==2026.10.26"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py transcribe.py sources.py capture_audio.py
